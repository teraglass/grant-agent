# MLflow 서버 단독 실행용 (SQLite + 로컬 아티팩트).
# mlops-eurosat 프로젝트의 MLflow(5001)가 이미 떠 있다면 이 파일은 쓰지 않아도 됩니다.
services:
  mlflow:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN pip install --no-cache-dir "mlflow>=3.5,<4"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --allowed-hosts "localhost:*,127.0.0.1:*"
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow-data:/mlflow

volumes:
  mlflow-data:
