name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      # LLM 호출 없이 (가짜 응답) 에이전트 흐름·트레이싱·프롬프트 레지스트리·결정 규칙 검증
      - run: uv run pytest -q
